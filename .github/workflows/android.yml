name: Android APK

on:
  push:
    branches: [claude/organista-android]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      refresh_notes:
        description: 'Doplniť popisy zmien ku všetkým existujúcim vydaniam'
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Zostaviť APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testy webovej časti
        run: npm test

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner má Android SDK predinštalované; akcia len nastaví cesty.
      # packages: '' preskočí jej predvolený zoznam (obsahuje zrušený balík "tools").
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Súčasti SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Podpisovací kľúč
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ORGANISTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/organista.jks"
            echo "keystore=$RUNNER_TEMP/organista.jks" >> "$GITHUB_OUTPUT"
            echo "Použije sa vlastný podpisovací kľúč."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "Kľúč nie je nastavený – APK sa podpíše ladiacim kľúčom."
          fi

      - name: Zostaviť APK
        working-directory: android
        env:
          ORGANISTA_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          ORGANISTA_KEYSTORE_PASSWORD: ${{ secrets.ORGANISTA_KEYSTORE_PASSWORD }}
          ORGANISTA_KEY_ALIAS: ${{ secrets.ORGANISTA_KEY_ALIAS }}
          ORGANISTA_KEY_PASSWORD: ${{ secrets.ORGANISTA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Pripraviť súbor na stiahnutie
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          SOURCE=android/app/build/outputs/apk/release/app-release.apk
          TARGET="organista-$VERSION.apk"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la "$TARGET"

      - name: Popis zmien
        id: notes
        env:
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          # Vyberie z CHANGELOG.md časť patriacu k tejto verzii.
          BODY=$(awk -v v="## $VERSION" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            BODY="Táto verzia nemá zapísané zmeny v CHANGELOG.md."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Uložiť ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: organista-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      # Stále dostupná verzia na stiahnutie do tabletu.
      - name: Zverejniť na stiahnutie
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          TAG=android-latest
          NOTES="Aplikácia Organista pre Android, verzia **$VERSION** (commit ${GITHUB_SHA::7}).

          Stiahni súbor \`$APK\` do tabletu a otvor ho. Android sa spýta na povolenie
          inštalácie z neznámych zdrojov – potvrď ho. Návod je v súbore README.md.

          ---

          ## Čo je nové vo verzii $VERSION

          ${{ steps.notes.outputs.body }}

          ---

          Staršie verzie zostávajú dostupné vo vydaniach \`v1.x.y\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --title "Organista pre Android (posledná verzia)" --target "$GITHUB_SHA"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Organista pre Android (posledná verzia)" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

      # Každá verzia má vlastné vydanie, ktoré sa už nikdy neprepisuje,
      # takže staršie verzie zostávajú natrvalo dostupné na stiahnutie.
      - name: Archív verzie
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          VTAG="v$VERSION"
          NOTES="Organista pre Android **$VERSION** (commit ${GITHUB_SHA::7}).

          Súbor \`$APK\` stiahni do tabletu a otvor ho.
          Najnovšiu verziu nájdeš vždy vo vydaní **android-latest**.

          ---

          ## Zmeny v tejto verzii

          ${{ steps.notes.outputs.body }}"
          if gh release view "$VTAG" >/dev/null 2>&1; then
            gh release upload "$VTAG" "$APK" --clobber
            gh release edit "$VTAG" --notes "$NOTES"
            echo "Vydanie $VTAG aktualizované."
          else
            gh release create "$VTAG" "$APK" \
              --title "Organista $VERSION" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
            echo "Vydanie $VTAG vytvorené."
          fi

      # Jednorazové doplnenie popisov k starším vydaniam z CHANGELOG.md.
      - name: Doplniť popisy starších vydaní
        if: inputs.refresh_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 50 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' || true); do
            version="${tag#v}"
            body=$(awk -v v="## $version" '
              $0 == v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)
            if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
              echo "$tag: v CHANGELOG.md nie je záznam, preskakujem."
              continue
            fi
            printf 'Organista pre Android **%s**.\n\nSúbor `organista-%s.apk` stiahni do tabletu a otvor ho.\n\n---\n\n## Zmeny v tejto verzii\n\n%s\n' \
              "$version" "$version" "$body" > notes.md
            gh release edit "$tag" --notes-file notes.md
            echo "$tag: popis doplnený."
          done

      - name: Pridať APK k vydaniu
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
