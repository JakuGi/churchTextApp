name: Android APK

on:
  push:
    branches: [claude/organista-android]
    paths-ignore: ['**.md']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Zostaviť APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testy webovej časti
        run: npm test

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner má Android SDK predinštalované; akcia len nastaví cesty.
      # packages: '' preskočí jej predvolený zoznam (obsahuje zrušený balík "tools").
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Súčasti SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Podpisovací kľúč
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ORGANISTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/organista.jks"
            echo "keystore=$RUNNER_TEMP/organista.jks" >> "$GITHUB_OUTPUT"
            echo "Použije sa vlastný podpisovací kľúč."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "Kľúč nie je nastavený – APK sa podpíše ladiacim kľúčom."
          fi

      - name: Zostaviť APK
        working-directory: android
        env:
          ORGANISTA_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          ORGANISTA_KEYSTORE_PASSWORD: ${{ secrets.ORGANISTA_KEYSTORE_PASSWORD }}
          ORGANISTA_KEY_ALIAS: ${{ secrets.ORGANISTA_KEY_ALIAS }}
          ORGANISTA_KEY_PASSWORD: ${{ secrets.ORGANISTA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Pripraviť súbor na stiahnutie
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          SOURCE=android/app/build/outputs/apk/release/app-release.apk
          TARGET="organista-$VERSION.apk"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la "$TARGET"

      - name: Uložiť ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: organista-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      # Stále dostupná verzia na stiahnutie do tabletu.
      - name: Zverejniť na stiahnutie
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          TAG=android-latest
          NOTES="Aplikácia Organista pre Android, verzia $VERSION (zostavené z commitu ${GITHUB_SHA::7}).

          Stiahni súbor \`$APK\` do tabletu a otvor ho. Android sa spýta na povolenie
          inštalácie z neznámych zdrojov – potvrď ho.

          Návod je v súbore README.md."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --title "Organista pre Android (posledná verzia)"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Organista pre Android (posledná verzia)" \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Pridať APK k vydaniu
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
