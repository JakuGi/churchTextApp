name: Android APK

on:
  push:
    branches: [main, claude/organista-android]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      refresh_notes:
        description: 'Doplniť popisy zmien ku všetkým existujúcim vydaniam'
        type: boolean
        default: false
      rename_releases:
        description: 'Premenovať staré vydania v1.x.y na alfa verzie a0.x.y'
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Jednorazové premenovanie starých vydaní v1.x.y na alfa značky a0.x.y.
  # Beží len pri ručnom spustení so zaškrtnutou voľbou a musí skončiť skôr,
  # než zostavenie vytvorí vydanie s novou značkou.
  rename:
    name: Premenovať staré vydania
    runs-on: ubuntu-latest
    if: inputs.rename_releases
    steps:
      - uses: actions/checkout@v4

      - name: Premenovať vydania
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # staré → nové; poradie od najstaršej verzie
          MAP="v1.0.0=a0.0.0 v1.0.1=a0.0.1 v1.1.0=a0.1.0 v1.1.1=a0.1.1"
          for pair in $MAP; do
            old="${pair%%=*}"
            new="${pair#*=}"
            if ! gh release view "$old" >/dev/null 2>&1; then
              echo "$old: vydanie neexistuje, preskakujem."
              continue
            fi
            if gh release view "$new" >/dev/null 2>&1; then
              echo "$new: už existuje, $old nechávam tak."
              continue
            fi

            sha=$(gh api "repos/$REPO/git/ref/tags/$old" --jq '.object.sha' 2>/dev/null || true)
            if [ -z "$sha" ]; then
              sha=$(gh release view "$old" --json targetCommitish --jq '.targetCommitish')
            fi

            rm -rf rename-assets && mkdir rename-assets
            gh release download "$old" --dir rename-assets --pattern '*.apk' || true
            for file in rename-assets/*.apk; do
              [ -e "$file" ] || continue
              mv "$file" "rename-assets/organista-$new.apk"
            done

            body=$(awk -v v="## $new" '
              $0 == v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)
            if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
              body="Táto verzia nemá zapísané zmeny v CHANGELOG.md."
            fi
            export BODY="$body" NEW="$new" OLD="$old"
            {
              printf 'Organista pre Android **%s** (pôvodne označená ako %s).\n\n' "$NEW" "${OLD#v}"
              printf 'Alfa verzia – aplikácia je ešte v skúšobnej prevádzke.\n'
              printf 'Súbor `organista-%s.apk` stiahni do tabletu a otvor ho.\n\n' "$NEW"
              printf -- '---\n\n## Zmeny v tejto verzii\n\n'
              printf '%s\n' "$BODY"
            } > notes-rename.md

            if ls rename-assets/*.apk >/dev/null 2>&1; then
              gh release create "$new" rename-assets/*.apk \
                --title "Organista $new" --notes-file notes-rename.md \
                --target "$sha" --prerelease
            else
              gh release create "$new" \
                --title "Organista $new" --notes-file notes-rename.md \
                --target "$sha" --prerelease
            fi
            gh release delete "$old" --yes --cleanup-tag
            echo "$old premenované na $new."
          done

  build:
    name: Zostaviť APK
    runs-on: ubuntu-latest
    needs: [rename]
    # rename sa väčšinou preskočí; zostavenie musí bežať aj vtedy.
    if: always() && needs.rename.result != 'failure' && needs.rename.result != 'cancelled'

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testy webovej časti
        run: npm test

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner má Android SDK predinštalované; akcia len nastaví cesty.
      # packages: '' preskočí jej predvolený zoznam (obsahuje zrušený balík "tools").
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Súčasti SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Podpisovací kľúč
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ORGANISTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/organista.jks"
            echo "keystore=$RUNNER_TEMP/organista.jks" >> "$GITHUB_OUTPUT"
            echo "Použije sa vlastný podpisovací kľúč."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "Kľúč nie je nastavený – APK sa podpíše ladiacim kľúčom."
          fi

      - name: Zostaviť APK
        working-directory: android
        env:
          ORGANISTA_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          ORGANISTA_KEYSTORE_PASSWORD: ${{ secrets.ORGANISTA_KEYSTORE_PASSWORD }}
          ORGANISTA_KEY_ALIAS: ${{ secrets.ORGANISTA_KEY_ALIAS }}
          ORGANISTA_KEY_PASSWORD: ${{ secrets.ORGANISTA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Pripraviť súbor na stiahnutie
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          SOURCE=android/app/build/outputs/apk/release/app-release.apk
          TARGET="organista-$VERSION.apk"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la "$TARGET"

      - name: Popis zmien
        id: notes
        env:
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          # Vyberie z CHANGELOG.md časť patriacu k tejto verzii.
          BODY=$(awk -v v="## $VERSION" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            BODY="Táto verzia nemá zapísané zmeny v CHANGELOG.md."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Uložiť ako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: organista-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      # Stále dostupná verzia na stiahnutie do tabletu.
      # Popis sa skladá cez printf a premenné prostredia, aby sa text
      # z CHANGELOG.md nikdy neinterpretoval ako príkazy (obsahuje `apostrofy`).
      - name: Zverejniť na stiahnutie
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
          CHANGES: ${{ steps.notes.outputs.body }}
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
        run: |
          TAG=android-latest
          {
            printf 'Aplikácia Organista pre Android, verzia **%s** (commit %s).\n\n' "$VERSION" "${GITHUB_SHA::7}"
            printf 'Stiahni súbor `%s` do tabletu a otvor ho. Android sa spýta na povolenie\n' "$APK"
            printf 'inštalácie z neznámych zdrojov – potvrď ho. Návod je v súbore README.md.\n\n'
            printf -- '---\n\n## Čo je nové vo verzii %s\n\n' "$VERSION"
            printf '%s\n\n' "$CHANGES"
            printf -- '---\n\nStaršie verzie zostávajú dostupné vo vydaniach `a0.x.y`.\n'
            if [ -z "$KEYSTORE" ]; then
              printf '\n> ⚠️ Táto verzia je podpísaná dočasným kľúčom, ktorý je pri každom zostavení iný.\n'
              printf '> Aktualizácia cez existujúcu inštaláciu preto zlyhá a starú verziu treba najprv\n'
              printf '> odinštalovať. Trvale to vyrieši vlastný podpisovací kľúč – postup je v README\n'
              printf '> v časti *Vlastný podpisovací kľúč*.\n'
            fi
          } > notes-latest.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Organista pre Android (posledná verzia)" \
              --notes-file notes-latest.md \
              --target "$GITHUB_SHA"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Organista pre Android (posledná verzia)" \
              --notes-file notes-latest.md \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

      # Každá verzia má vlastné vydanie, ktoré sa už nikdy neprepisuje,
      # takže staršie verzie zostávajú natrvalo dostupné na stiahnutie.
      - name: Archív verzie
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
          CHANGES: ${{ steps.notes.outputs.body }}
        run: |
          # Alfa verzie (a0.x.y) sú značkou samy o sebe, číselné verzie dostanú „v“.
          case "$VERSION" in
            [0-9]*) VTAG="v$VERSION" ;;
            *) VTAG="$VERSION" ;;
          esac
          {
            printf 'Organista pre Android **%s** (commit %s).\n\n' "$VERSION" "${GITHUB_SHA::7}"
            printf 'Súbor `%s` stiahni do tabletu a otvor ho.\n' "$APK"
            printf 'Najnovšiu verziu nájdeš vždy vo vydaní **android-latest**.\n\n'
            printf -- '---\n\n## Zmeny v tejto verzii\n\n'
            printf '%s\n' "$CHANGES"
          } > notes-version.md

          if gh release view "$VTAG" >/dev/null 2>&1; then
            gh release upload "$VTAG" "$APK" --clobber
            gh release edit "$VTAG" --notes-file notes-version.md
            echo "Vydanie $VTAG aktualizované."
          else
            PRERELEASE=""
            case "$VERSION" in a*) PRERELEASE="--prerelease" ;; esac
            gh release create "$VTAG" "$APK" \
              --title "Organista $VERSION" \
              --notes-file notes-version.md \
              --target "$GITHUB_SHA" $PRERELEASE
            echo "Vydanie $VTAG vytvorené."
          fi

      # Jednorazové doplnenie popisov k starším vydaniam z CHANGELOG.md.
      - name: Doplniť popisy starších vydaní
        if: inputs.refresh_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 50 --json tagName --jq '.[].tagName' | grep -E '^(v[0-9]|a[0-9])' || true); do
            version="${tag#v}"
            body=$(awk -v v="## $version" '
              $0 == v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)
            if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
              echo "$tag: v CHANGELOG.md nie je záznam, preskakujem."
              continue
            fi
            printf 'Organista pre Android **%s**.\n\nSúbor `organista-%s.apk` stiahni do tabletu a otvor ho.\n\n---\n\n## Zmeny v tejto verzii\n\n%s\n' \
              "$version" "$version" "$body" > notes.md
            gh release edit "$tag" --notes-file notes.md
            echo "$tag: popis doplnený."
          done

      - name: Pridať APK k vydaniu
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
