<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texty piesní – obrazovka</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/display.css">
</head>
<body class="display">
<div id="root" class="display__root"></div>
<div id="status" class="dstatus">Pripájam sa k tabletu…</div>
<button id="fs" class="fsbtn" title="Na celú obrazovku">⛶</button>
<script type="module">
  import { createDisplay } from './js/display-core.js';
  import { createLocalBus, subscribeNet } from './js/bus.js';

  const display = createDisplay(document.getElementById('root'));
  const statusBox = document.getElementById('status');
  let gotText = false;

  const show = (state) => {
    display.render(state);
    if (state && !state.blank && state.lines && state.lines.length) {
      gotText = true;
      statusBox.hidden = true;
    }
  };
  const setStatus = (text, ok) => {
    if (gotText) return;
    statusBox.textContent = text;
    statusBox.className = `dstatus${ok ? ' dstatus--ok' : ''}`;
    statusBox.hidden = false;
  };

  // V aplikácii pre Android posiela stav natívna časť. Miestny prenos
  // (BroadcastChannel/localStorage) sa tam nepoužíva – jeho správy chodia
  // s oneskorením a prepísali by čerstvý stav tým predchádzajúcim.
  const native = !!window.OrganistaNative;
  if (!native) createLocalBus().subscribe(show);

  // Aplikácia pre Android posiela stav priamo sem, na druhú obrazovku.
  window.organistaRender = (state) => {
    if (state) show(state);
  };
  if (native) setStatus('Pripojené k tabletu. Čakám na text piesne…', true);
  const net = native ? null : subscribeNet(show, {
    onOpen: () => setStatus('Pripojené k tabletu. Čakám na text piesne…', true),
    onError: () => setStatus('Server nedostupný – skontroluj Wi-Fi a adresu.', false),
  });
  if (!native && !net) setStatus('Táto obrazovka je riadená z toho istého zariadenia.', true);
  setTimeout(() => { if (!gotText) statusBox.hidden = false; }, 500);

  const fsButton = document.getElementById('fs');
  fsButton.onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  document.addEventListener('keydown', (event) => {
    if (event.key === 'f' || event.key === 'F') fsButton.click();
  });
  let timer;
  const showCursor = () => {
    document.body.classList.remove('is-idle');
    clearTimeout(timer);
    timer = setTimeout(() => document.body.classList.add('is-idle'), 3000);
  };
  document.addEventListener('mousemove', showCursor);
  showCursor();
</script>
</body>
</html>
