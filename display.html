<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texty piesní – obrazovka</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/display.css">
</head>
<body class="display">
<div id="root" class="display__root"></div>
<div id="status" class="dstatus">Pripájam sa k tabletu…</div>
<button id="fs" class="fsbtn" title="Na celú obrazovku">⛶</button>
<script type="module">
  import { createDisplay } from './js/display-core.js';
  import { createLocalBus, subscribeNet } from './js/bus.js';

  const display = createDisplay(document.getElementById('root'));
  const statusBox = document.getElementById('status');
  let gotState = false;

  const show = (state) => {
    if (!state) return;
    display.render(state);
    // Akýkoľvek stav z tabletu znamená, že spojenie funguje – aj čierna
    // obrazovka. Hlásenie o pripájaní sa už potom nikdy neukáže.
    gotState = true;
    statusBox.hidden = true;
  };
  const setStatus = (text, ok) => {
    if (gotState) return;
    statusBox.textContent = text;
    statusBox.className = `dstatus${ok ? ' dstatus--ok' : ''}`;
    statusBox.hidden = false;
  };

  // Druhú obrazovku v aplikácii pre Android otvára natívna časť s ?rezim=tv.
  // Most window.OrganistaNative v tomto okne nie je, preto sa režim pozná
  // podľa adresy. Miestny prenos (BroadcastChannel/localStorage) ani server
  // sa tu nepoužívajú – stav chodí priamo z natívnej časti.
  const native = new URLSearchParams(location.search).get('rezim') === 'tv'
    || !!window.OrganistaNative;

  // Aplikácia pre Android posiela stav priamo sem, na druhú obrazovku.
  window.organistaRender = (state) => show(state);

  if (native) {
    setStatus('Pripojené k tabletu. Čakám na text piesne…', true);
  } else {
    createLocalBus().subscribe(show);
    const net = subscribeNet(show, {
      onOpen: () => setStatus('Pripojené k tabletu. Čakám na text piesne…', true),
      onError: () => setStatus('Server nedostupný – skontroluj Wi-Fi a adresu.', false),
    });
    if (!net) setStatus('Táto obrazovka je riadená z toho istého zariadenia.', true);
  }

  const fsButton = document.getElementById('fs');
  fsButton.onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  document.addEventListener('keydown', (event) => {
    if (event.key === 'f' || event.key === 'F') fsButton.click();
  });
  let timer;
  const showCursor = () => {
    document.body.classList.remove('is-idle');
    clearTimeout(timer);
    timer = setTimeout(() => document.body.classList.add('is-idle'), 3000);
  };
  document.addEventListener('mousemove', showCursor);
  showCursor();
</script>
</body>
</html>
